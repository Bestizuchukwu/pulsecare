<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PulseCare | Health Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <div class="phone-shell">
      <div class="notch"></div>

      <header class="topbar">
        <div>
          <p class="eyebrow">Wellness overview</p>
          <h1>PulseCare</h1>
        </div>
        <button class="icon-button" id="notifBtn" aria-label="Notifications" aria-expanded="false" data-count="0">🔔</button>
      </header>

      <main class="dashboard">
        <section class="notif-panel" id="notifPanel" hidden></section>
        <section class="hero-card">
          <div class="hero-text">
            <p class="small-label">Today</p>
            <h2 id="heroTitle">Good health trend</h2>
          </div>
          <span id="todayDate" class="date-pill">Loading...</span>
        </section>

        <section class="quick-stats">
          <div class="mini-stat"><span class="mini-label">Walk</span><strong id="statWalk">–</strong></div>
          <div class="mini-stat"><span class="mini-label">Sleep</span><strong id="statSleep">–</strong></div>
          <div class="mini-stat"><span class="mini-label">Run</span><strong id="statRun">–</strong></div>
        </section>

        <input class="search-box" id="metricSearch" type="search" placeholder="Search metrics" aria-label="Search metrics" />

        <section class="metric-grid" id="metricGrid"></section>
      </main>
    </div>
  </body>
</html>
