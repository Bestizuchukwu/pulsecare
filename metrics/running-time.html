<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeping Time History | PulseCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="../app.js"></script>
  </head>
  <body class="detail-page">
    <div class="phone-shell">
      <div class="notch"></div>

      <header class="detail-header">
        <a class="back-btn" href="../index.html" aria-label="Back">←</a>
        <div>
          <p class="eyebrow">Health check</p>
          <h1>Sleeping Time</h1>
        </div>
        <span class="status-tag">Rested</span>
      </header>

      <main class="detail-body">
        <section class="metric-highlight">
          <div class="highlight-ring">
            <div>
              <strong>7.8</strong>
              <small>7-day avg</small>
            </div>
          </div>

          <div class="mini-readings">
            <div class="mini-reading">
              <label>Week</label>
              <strong>6 days</strong>
            </div>
            <div class="mini-reading">
              <label>Change</label>
              <strong>+0.4h</strong>
            </div>
            <div class="mini-reading">
              <label>Goal</label>
              <strong>8.0h</strong>
            </div>
          </div>
        </section>

        <nav class="action-tabs" aria-label="Metric navigation">
          <a class="tab" href="sleeping-time.html">Overview</a>
          <a class="tab active" href="sleeping-time-history.html">History</a>
        </nav>

        <section class="history-card">
          <h3>Recent history</h3>
          <ul class="history-list">
            <li class="history-item">
              <div class="meta">
                <strong>7.8h</strong>
                <time>Today</time>
              </div>
              <span class="trend up">Good</span>
            </li>
            <li class="history-item">
              <div class="meta">
                <strong>7.5h</strong>
                <time>Yesterday</time>
              </div>
              <span class="trend up">+0.3h</span>
            </li>
            <li class="history-item">
              <div class="meta">
                <strong>7.2h</strong>
                <time>2 days ago</time>
              </div>
              <span class="trend up">+0.5h</span>
            </li>
            <li class="history-item">
              <div class="meta">
                <strong>6.9h</strong>
                <time>3 days ago</time>
              </div>
              <span class="trend down">-0.3h</span>
            </li>
          </ul>
        </section>
      </main>
    </div>
  </body>
</html>
