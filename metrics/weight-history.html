<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weight | PulseCare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <script defer src="../app.js"></script>
  </head>
  <body class="detail-page">
    <div class="phone-shell">
      <div class="notch"></div>

      <header class="detail-header">
        <a class="back-btn" href="../index.html" aria-label="Back">←</a>
        <div>
          <p class="eyebrow">Health check</p>
          <h1>Weight</h1>
        </div>
        <span class="status-tag">Balanced</span>
      </header>

      <main class="detail-body">
        <section class="metric-highlight">
          <div class="highlight-ring">
            <div>
              <strong>69.4</strong>
              <small>kg</small>
            </div>
          </div>

          <div class="mini-readings">
            <div class="mini-reading">
              <label>Goal</label>
              <strong>68.5</strong>
            </div>
            <div class="mini-reading">
              <label>Trend</label>
              <strong>-0.4</strong>
            </div>
            <div class="mini-reading">
              <label>Body</label>
              <strong>Fit</strong>
            </div>
          </div>
        </section>

        <nav class="action-tabs" aria-label="Metric navigation">
          <a class="tab active" href="weight.html">Overview</a>
          <a class="tab" href="weight-history.html">History</a>
        </nav>

        <section class="metric-summary">
          <h3>Overview</h3>
          <div class="summary-grid">
            <div class="kpi-box">
              <span class="kpi-label">Last read</span>
              <strong>7:00 AM</strong>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">BMI</span>
              <strong>22.4</strong>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">Avg</span>
              <strong>69.8 kg</strong>
            </div>
            <div class="kpi-box">
              <span class="kpi-label">Goal</span>
              <strong>68-70</strong>
            </div>
          </div>
        </section>

        <section class="detail-card">
          <div class="detail-copy">
            <p>
              Weight remains stable and close to the desired health range. Consistent nutrition and daily movement support ongoing balance and healthy body composition.
            </p>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
